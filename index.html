<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kailash Ramakrishnan | Backend AI Engineer</title>
<meta name="description" content="Backend AI Engineer working in Go, Python and PostgreSQL. Query the database to find out more.">
<meta name="theme-color" content="#FDF6E3">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23B8420F'/%3E%3Ctext x='16' y='22' font-family='monospace' font-size='18' font-weight='700' text-anchor='middle' fill='%23fff'%3EK%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=JetBrains+Mono:wght@400;500;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="top">
  <div class="brand" id="brand">
    <button class="dot" id="statusDot" type="button" aria-label="Connection status"></button>
    <span id="brandText">kailash@portfolio</span>
    <span class="mute brand-path">/ public / <span id="modeLabel">schema view</span></span>
  </div>

  <div class="toggle" role="tablist" aria-label="View">
    <button id="modeSchema" role="tab" aria-selected="true" type="button">Schema</button>
    <button id="modeTable" role="tab" aria-selected="false" type="button">Table</button>
  </div>

  <nav class="links" aria-label="Contact links">
    <a class="btn ghost hide-sm" href="https://github.com/Mildsauce9" target="_blank" rel="noopener">GitHub</a>
    <a class="btn ghost hide-sm" href="https://linkedin.com/in/connect-with-kailash" target="_blank" rel="noopener">LinkedIn</a>
    <button class="btn accent" id="connectBtn" type="button">Connect with me</button>
  </nav>
</header>

<main id="stage" class="stage">
  <div id="canvas" class="canvas">
    <div id="world" class="world">
      <svg id="links" class="links-svg" aria-hidden="true"></svg>
    </div>
  </div>

  <section id="tableview" class="tableview" hidden>
    <div id="tabs" class="tabs" role="tablist" aria-label="Tables"></div>
    <p id="tableHint" class="table-hint" hidden>Pick a table to inspect it. Click anywhere outside to close it again.</p>
  </section>
</main>

<section id="results" class="results" hidden aria-live="polite" aria-label="Query result">
  <div class="res-head">
    <span id="resMeta" class="mute"></span>
    <button id="resClose" class="x" type="button" aria-label="Close result">&times;</button>
  </div>
  <div id="resBody" class="res-body"></div>
</section>

<div class="dock">
  <div id="chips" class="chips"></div>
  <form id="qform" class="qbar" autocomplete="off">
    <label for="q" class="sr">SQL query</label>
    <span class="prompt" aria-hidden="true">&rsaquo;</span>
    <input id="q" name="q" type="text" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" placeholder="SELECT * FROM experience;">
    <kbd class="kbd" aria-hidden="true">/</kbd>
    <button class="run" type="submit">Run</button>
  </form>
</div>

<div id="zoom" class="zoom" role="group" aria-label="Zoom">
  <button id="zoomOut" type="button" aria-label="Zoom out">&minus;</button>
  <button id="zoomLabel" type="button" aria-label="Fit to screen">100%</button>
  <button id="zoomIn" type="button" aria-label="Zoom in">+</button>
</div>

<dialog id="connect" class="dlg" aria-labelledby="cTitle">
  <form id="cForm" novalidate>
    <div class="dlg-h">
      <h2 id="cTitle">Let's talk</h2>
      <button class="x" type="button" id="cClose" aria-label="Close">&times;</button>
    </div>
    <p class="dlg-p" id="cIntro"></p>
    <label for="cEmail">Your email</label>
    <input id="cEmail" name="email" type="email" required autocomplete="email" placeholder="you@company.com">
    <label for="cMsg">Message <span class="mute">(optional)</span></label>
    <textarea id="cMsg" name="message" rows="3" placeholder="What are you working on?"></textarea>
    <div id="cStatus" class="dlg-status" role="status"></div>
    <div class="dlg-actions">
      <button class="btn ghost" type="button" id="cCopy">Copy my email</button>
      <button class="btn accent" type="submit" id="cSend">Send</button>
    </div>
  </form>
</dialog>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/cases.js"></script>
<script src="js/sql.js"></script>
<script src="js/app.js"></script>
</body>
</html>
